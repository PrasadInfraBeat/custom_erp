[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infrabeat-erp"
version = "0.1.0"
description = "InfraBeat ERPNext CLI - discovery, OAuth, and MCP query bridge for FAC."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "InfraBeat" }]
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "keyring>=24,<26",
    "cryptography>=42,<46",
    "textual>=0.50",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-mock>=3",
    "anyio>=4",
    "respx>=0.20",
]

[project.scripts]
infrabeat-erp = "infrabeat_erp.cli:main"
infrabeat = "infrabeat_erp.tui:main"


[tool.setuptools.packages.find]
where = ["src"]
