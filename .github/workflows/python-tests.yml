name: Python Tests

on:
  pull_request:
    branches: [dev, staging, production]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package with test extras
        run: pip install -e "./tools/infrabeat_erp[test]"

      - name: Smoke - infrabeat-erp --help (CLI entry post-refactor)
        run: infrabeat-erp --help
      - name: Smoke - infrabeat --check (no TUI launch in CI)
        run: infrabeat --check
      - name: Smoke - infrabeat-erp doctor --help (Task D subcommand)
        run: infrabeat-erp doctor --help
      - name: Run pytest with coverage
        run: pytest tools/infrabeat_erp/tests/ --cov=infrabeat_erp --cov-report=html --cov-report=term --cov-fail-under=70

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-py${{ matrix.python-version }}
          path: htmlcov/
          if-no-files-found: warn
          retention-days: 14
